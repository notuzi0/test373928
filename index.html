<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Papa's Freezeria</title>

    <script src="ruffle.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        ruffle-player {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <ruffle-player id="player"></ruffle-player>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};

        window.addEventListener("load", function () {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();

            player.style.width = "100%";
            player.style.height = "100%";

            document.getElementById("player").replaceWith(player);

            player.ruffle().load("papasfreezeria.swf");
        });
    </script>

</body>
</html>
